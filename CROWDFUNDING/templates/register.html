<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
<title> Register</title>

<link rel="shortcut icon" href="{% static 'assets/img/favicon.png' %}">

<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,500;0,700;0,900;1,400;1,500;1,700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{% static 'assets/plugins/bootstrap/css/bootstrap.min.css' %}">

<link rel="stylesheet" href="{% static 'assets/plugins/feather/feather.css' %}">

<link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/fontawesome.min.css' %}">
<link rel="stylesheet" href="{% static 'assets/plugins/fontawesome/css/all.min.css' %}">

<link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
</head>
<body>

<div class="main-wrapper login-body">
<div class="login-wrapper">
<div class="container">
<div class="loginbox">
<div class="login-left">
<img class="img-fluid" src="{% static 'assets/img/login.png' %}" alt="Logo">
</div>
<div class="login-right">
<div class="login-right-wrap">
<h1>S'inscrire</h1>
{% for mes in messages  %}
<p style="color: red; margin-left:20%">{{mes}}</p>
{% endfor %}
<p class="account-subtitle">Entrer les details pour créer votre compte</p>

<form method="post" action="{% url 'registe' %}" enctype="multipart/form-data" >
    {% csrf_token %}
    <div class="form-group">
        <label>Utilisateur <span class="login-danger">*</span></label>
        <input class="form-control" name="username" type="text">
        <span class="profile-views"><i class="fas fa-user-circle"></i></span>
    </div>

    <div class="form-group">
        <label>First_name <span class="login-danger">*</span></label>
        <input class="form-control" name="first_name" type="text">
        <span class="profile-views"><i class="fas fa-user-circle"></i></span>
    </div>
    <div class="form-group">
        <label>Last_name <span class="login-danger">*</span></label>
        <input class="form-control" name="last_name" type="text">
        <span class="profile-views"><i class="fas fa-user-circle"></i></span>
    </div>

    <div class="form-group">
    <label>Email <span class="login-danger">*</span></label>
    <input class="form-control" required name="email" type="email">
    <span class="profile-views"><i class="fas fa-envelope"></i></span>
    </div>
    <div class="form-group">
    <label>Password <span class="login-danger">*</span></label>
    <input class="form-control" name="password1" type="password">
    <span class="profile-views feather-eye toggle-password"></span>
    </div>
    <div class="form-group">
    <label>Confirm password <span class="login-danger">*</span></label>
    <input class="form-control" name="password2" type="password">
    <span class="profile-views feather-eye reg-toggle-password"></span>
    </div>

    <div class="form-group">
        <label>Compte Paypal <span class="login-danger">*</span></label>
        <input class="form-control" required name="compte" type="text">
        <span class="profile-views feather-eye reg-toggle-password"></span>
        </div>


    <div class="form-group">
        <label>Photo de Profil <span class="login-danger">*</span></label>
        
        <input type="file" required class="form-control" name="Photo" id="">
        
    </div>
    <div class=" dont-have">Dèja enreistré? <a href="{% url 'login' %}">Connectez-vous</a></div>
    <div class="form-group mb-0">
    <button class="btn btn-primary btn-block" type="submit">Créer</button>
    </div>
</form>

<div class="login-or">
<span class="or-line"></span>
<span class="span-or">or</span>
</div>

<div class="social-login">
<a href="#"><i class="fab fa-google-plus-g"></i></a>
<a href="#"><i class="fab fa-facebook-f"></i></a>
<a href="#"><i class="fab fa-twitter"></i></a>
<a href="#"><i class="fab fa-linkedin-in"></i></a>
</div>

</div>
</div>
</div>
</div>
</div>
</div>


<script src="{% static 'assets/js/jquery-3.6.0.min.js' %}"></script>
<script src="{% static 'assets/plugins/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

<script src="{% static 'assets/js/feather.min.js' %}"></script>

<script src="{% static 'assets/js/script.js' %}"></script>
</body>
</html>
